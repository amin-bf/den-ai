cfg = { input = "5.cfg", recommended = [3, 6], allowed = [1, 12] }
sampler = { input = "5.sampler_name", recommended = ["dpmpp_2m", "dpmpp_2m_sde"] }
scheduler = { input = "5.scheduler", recommended = ["karras"] }

# Guide-image preprocessors: a control type den can derive from an ordinary photo itself,
# instead of the caller bringing a ready-made map. `canny` is built into ComfyUI and always
# works; the ones here need a model file, and a workflow offers the type as "from a photo"
# only once that file is downloaded — otherwise the type still takes a ready-made map.
#   file         the model file it needs
#   dir          the folder under ComfyUI's models/ that file goes in (default: checkpoints)
#   url          where setup.sh fetches it from, if it's missing (optional: without one, setup
#                only says which file to download)
#   description  what the map is good for, for whoever picks a guide type
[image.preprocessors.pose]
file = "sdpose_wholebody_fp16.safetensors"
dir = "checkpoints"
url = "https://huggingface.co/Comfy-Org/SDPose/resolve/main/checkpoints/sdpose_wholebody_fp16.safetensors"
description = "SDPose wholebody: body, hands, feet and face keypoints drawn as an OpenPose skeleton."

# Upscale models a request may run the finished image through (upscale = {name, factor}), with
# any workflow, once the file is in ComfyUI's models/upscale_models folder.
#   file         the file name in models/upscale_models
#   scale        the model's native factor; a smaller requested factor scales down after it
#   description  what it suits, for whoever picks it
[image.upscalers.ultrasharp]
file = "4x-UltraSharp.safetensors"
scale = 4
description = "4x-UltraSharp: photos and general images, crisp detail."

[image.upscalers.realesrgan]
file = "RealESRGAN_x4plus.safetensors"
scale = 4
description = "Real-ESRGAN x4plus: photos; smoother than ultrasharp, cleans up noise."

[image.upscalers.realesrgan-anime]
file = "RealESRGAN_x4plus_anime_6B.pth"
scale = 4
description = "Real-ESRGAN x4plus anime: anime and illustration, clean lines and flat colour."

# LoRAs a request may add on top of a workflow (loras = [{name, strength}]). One is offered to
# every workflow of its family whose graph doesn't already load it, once the file is in
# ComfyUI's models/loras folder.
#   file         the file name in models/loras
#   family       the workflows' family it fits
#   description  what it does, for whoever picks it
#   strength     { default = …, recommended = [low, high], allowed = [low, high] }
[image.loras.aniedit]
file = "aniedit-klein9b-v2.safetensors"
family = "klein9b"
description = "AniEdit: anime and illustration look; on the realism workflow it pulls the image toward anime."
strength = { default = 1.0, recommended = [0.5, 1.0], allowed = [0, 1.5] }

# Clips (ADR 0009): short videos from video workflows, made on the image side (ComfyUI) as
# detached requests. A clip workflow is workflows/<name>.json plus [clip.workflows.<name>], with
# the image workflow keys description, note, prompt, negative, seed, size and settings, and:
#   fps        "node.input" holding the frame rate (read, not set)
#   duration   { input = "node.input" of the frame count, frame_step = n (frames are a multiple
#              of n, plus one), recommended = [low, high], allowed = [low, high] } in seconds
#   frames     node whose IMAGE output is the decoded frames, for the contact sheet
#   enabled    false leaves the workflow out everywhere, e.g. set in config.local.toml to hide an
#              example that a private workflow replaces (image workflows take it too)
#   sound      "node.input" that receives the decoded audio, for a model that makes sound: its
#              clips have a sound track, and sound = false takes the input and its decoder out
#   lip_sync   { input = "node.input" that takes the audio latent, vae = the audio VAE node }, for
#              a model that makes sound and picture together: a voice-over with sync is encoded
#              there and kept fixed, and the picture is made to it (ADR 0010)
#   family, model  as for image workflows: [image.loras] entries of that family are offered to
#              the clip workflow too, chained after the node whose MODEL output they patch
#   keyframes  [{ input = "node.input" or a list, at = 0 | "end" | "NN%" | "any", frame =
#              "node.input" that receives the frame index, passthrough = [input names] of a
#              guide node taken out when no keyframe fills it }]; a duration may also say
#              segments = n for a graph of n chained segments that share their boundary frames
[clip]
default_workflow = "ltxv-13b"

[clip.workflows.ltxv-13b]
description = """LTX-Video 0.9.8 13B distilled: the fast one, about 15 seconds of work per second \
of clip at 720p, sharp detail, and keyframes anywhere: one to start from and up to two more at \
any moment, which the clip passes through. Prompt: one long, detailed English paragraph (short \
prompts lose quality): the subject and what it does, the setting and light, and the camera."""
prompt = "6.text"
negative = "7.text"
seed = "72.noise_seed"
size = ["60"]
fps = "80.fps"
frames = "8"
family = "ltxv"
model = "44"
duration = { input = "60.length", frame_step = 8, recommended = [3, 6], allowed = [1, 8] }
keyframes = [
  { input = "91.image", at = 0, frame = "91.frame_idx", passthrough = ["positive", "negative", "latent"] },
  { input = "92.image", at = "any", frame = "92.frame_idx", passthrough = ["positive", "negative", "latent"] },
  { input = "93.image", at = "any", frame = "93.frame_idx", passthrough = ["positive", "negative", "latent"] },
]

[clip.workflows.ltxv-13b.settings]
steps = { input = "71.steps", recommended = [8, 10], allowed = [4, 20] }
cfg = { input = "72.cfg", allowed = [1, 4] }
sampler = { input = "73.sampler_name", recommended = ["euler"] }

[clip.workflows.wan22-5b]
description = """Wan 2.2 TI2V 5B: general clips up to 720p at 24 fps, from text or from a \
start image. Prompt: one detailed English paragraph: the subject, what moves and how, the \
setting and light, and the camera (static, slow pan right, dolly in). Motion words matter \
more than style words."""
prompt = "6.text"
negative = "7.text"
seed = "3.seed"
size = ["55"]
fps = "57.fps"
frames = "8"
family = "wan22-5b"
model = "37"
duration = { input = "55.length", frame_step = 4, recommended = [3, 5], allowed = [1, 8] }
keyframes = [{ input = "55.start_image", at = 0 }]

[clip.workflows.wan22-5b.settings]
steps = { input = "3.steps", recommended = [20, 30], allowed = [8, 50] }
cfg = { input = "3.cfg", recommended = [4, 6], allowed = [1, 10] }
sampler = { input = "3.sampler_name", recommended = ["uni_pc", "euler"] }
scheduler = { input = "3.scheduler", recommended = ["simple"] }

# LTX-2.3 from unsloth/LTX-2.3-GGUF (distilled-1.1 Q4_K_M, the distilled embeddings connectors
# and VAEs; the audio VAE goes in checkpoints/) and unsloth/gemma-3-12b-it-qat-GGUF
# (UD-Q4_K_XL), loaded by the ComfyUI-GGUF node setup.sh installs.
[clip.workflows.ltx23-distilled]
description = """LTX-2.3 22B distilled, quantized (GGUF) to fit beside a 12 GB GPU: realistic \
motion and people, 24 fps, with sound, from text, or through up to three keyframes: one to start \
from and two more at any moment. Prompt: one detailed English paragraph describing what happens \
over time: the subject and each action in order, the setting and light, the camera, and the \
sounds (ambience, footsteps, a line of dialogue in quotes, which a person on screen speaks). \
Heavier than ltxv-13b: its model is partly held in RAM."""
prompt = "6.text"
negative = "7.text"
seed = "15.noise_seed"
size = ["11"]
fps = "22.fps"
frames = "21"
sound = "22.audio"
lip_sync = { input = "14.audio_latent", vae = "4" }
family = "ltx23"
model = "1"
duration = { input = ["11.length", "13.frames_number"], frame_step = 8, recommended = [3, 5], allowed = [1, 8] }
keyframes = [
  { input = "31.image", at = 0, frame = "31.frame_idx", passthrough = ["positive", "negative", "latent"] },
  { input = "32.image", at = "any", frame = "32.frame_idx", passthrough = ["positive", "negative", "latent"] },
  { input = "33.image", at = "any", frame = "33.frame_idx", passthrough = ["positive", "negative", "latent"] },
]

[clip.workflows.ltx23-distilled.settings]
cfg = { input = "18.cfg", allowed = [1, 4] }
sampler = { input = "16.sampler_name", recommended = ["euler_ancestral"] }

# Tasks Claude may delegate. Each becomes an allowed value of the MCP tool's `task`
# argument; disabled tasks disappear from the tool. Toggle with: den task <name> on|off
[tasks.summarize]
enabled = true
description = "Condense long text, logs or files into the key points."
system = """You summarize accurately and concisely. Keep concrete facts: names, numbers, \
error messages, file paths. Never invent details that are not in the input. If the input \
does not contain what was asked for, say so."""

[tasks.extract]
enabled = true
description = "Pull specific facts or structured data (e.g. JSON) out of text or files."
system = """You extract exactly the requested information from the input. Output only the \
result in the requested format, with no commentary. Use null or an empty list for anything \
that is not present — never guess."""

[tasks.classify]
enabled = true
description = "Label or sort items into given categories."
