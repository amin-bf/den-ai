# Local AI toolchain configuration — edit by hand.
# Runtime switches (mode, active model, task on/off) live in state.json and are
# changed with the `den` CLI; the values here are only their defaults.

# on | off — the kill switch: off keeps every caller off the GPU. Whether a request's side can
# run follows what's installed and selected (an LLM model, a workflow), not the mode.
default_mode = "on"

# The GPU broker (`den serve`, a user systemd service). Everything that uses the GPU
# goes through it: the CLI, Claude's MCP server and pi. Nothing else talks to Ollama.
# Changing the address needs: systemctl --user restart den
[broker]
base_url = "http://127.0.0.1:11435"
# Batching when both sides want the GPU: while one side waits, the loaded side starts
# new requests only until either cap is reached, counted from when the other side started
# waiting. Running requests always finish before the swap (ADR 0002, ADR 0003).
batch_seconds = 120
batch_requests = 4

# The den on another machine, used as if it were the only one: `den --on NAME` or
# DEN_BROKER=NAME (ADR 0007 has the MCP server too). Reach one through an SSH tunnel so its
# broker stays on 127.0.0.1 there (ADR 0007). They belong to one machine, so name them in the
# git-ignored config.local.toml, e.g.:
#   [remotes.mac]
#   base_url = "http://127.0.0.1:11436"   # the tunnel's local end

# When the machine is too busy for den to load a model. A local model doesn't only hold the GPU:
# an MoE split across GPU and RAM keeps several GB of RAM and generates on the CPU too, so
# loading one while a test run or a build is going eats the resources that work needs. A side
# that is already loaded keeps serving; only loading one that isn't is refused, with the reason
# (ADR 0004). Set either to 0 to turn that limit off.
[limits]
# Refuse to load while the 1-minute load average per CPU is above this.
max_load_per_cpu = 0.8
# Refuse to load while less than this much RAM is available (MemAvailable), in GB.
min_free_ram_gb = 4.0
# How long a request waits for a busy machine to settle before it's refused. A build or a test
# run ends, and everything else in den waits rather than failing, so a short wait usually turns
# an error the caller has to notice and repeat into a slightly slower answer. It's bounded
# because the caller may be the one keeping the machine busy, and then waiting never helps.
# 0 refuses at once.
busy_wait = "60s"

[llm]
backend = "llama-server"
# Ollama is the model store: `den model` downloads into it (ollama pull) and its API says which
# GGUF file a model is. It no longer runs models; only the broker talks to it.
base_url = "http://127.0.0.1:11434"
# The llama-server binary the broker starts on the selected model (a child process, listening
# on a private UNIX socket), and extra arguments for it. An 8-bit conversation cache halves its
# memory: 64k with it measured within 3% of 32k's speed (ADR 0005).
server = "llama-server"
server_args = ["--cache-type-k", "q8_0", "--cache-type-v", "q8_0"]
# Load a model's vision projector when Ollama has one for it, so callers can send images
# (pi's read tool, for one). About 1 GB more memory; false saves it.
vision = true
# How long llama-server stays loaded after the last request before the broker stops it. The
# conversation's cache is saved when it stops and restored when it starts (ADR 0005).
keep_alive = "30m"
# Settings for whichever model is active. The model itself is not named here: pick one of
# the models Ollama has downloaded with `den model`.
# The context llama-server is started with; it fits the model split across GPU and RAM itself
# (--fit), so a larger context costs speed rather than failing. Keep pi's contextWindow equal.
# On the 27B hybrid model, 128k cost a quarter of the writing speed; 64k (with the 8-bit cache)
# cost almost nothing.
num_ctx = 65536
# Thinking was ~3.5x slower, used ~6K of the context and added small errors, without better
# summaries (ADR 0001). It applies to den's own delegation; pi sets its own.
think = false

[image]
backend = "comfyui"
# ComfyUI itself; only the broker talks to it. It finds model files in $COMFYUI_DIR/models
# (default ~/ComfyUI/models).
base_url = "http://127.0.0.1:8188"
# The systemd user unit the broker starts on a swap to images and stops on a swap back.
service = "comfyui"
# How long ComfyUI stays up after the last image request.
keep_alive = "30m"
# Used when a request names no workflow.
default_workflow = "z-image-turbo"
# How much a request's upscale enlarges the image unless it gives a factor.
upscale_factor = 2

# Workflows: workflows/<name>.json is the ComfyUI graph in API format (web UI: Export (API)).
# A workflow can run when the model files its graph names are downloaded.
#   description  what it's good at and how to write its prompt, for whoever picks the workflow
#   note         appended to the description; put private notes in config.local.toml instead
#   prompt       "node.input" that receives the prompt
#   negative     "node.input" for the negative prompt (optional)
#   seed         "node.input", or a list when several nodes take the seed
#   size         node ids whose width and height inputs receive the size (optional)
#   with_negative  {"node.input" = value} set only when a request brings a negative prompt, e.g.
#                wiring the negative encoder into the guider and raising cfg (optional)
#   settings     optional per-request settings: steps, cfg, sampler, scheduler, each
#                { input = "node.input" or a list, recommended = …, allowed = [low, high] }.
#                Defaults come from the graph; values outside allowed are refused. Samplers and
#                schedulers may be any ComfyUI name; recommended lists the ones that suit the model.
#   family, model  the model family ([image.loras] entries name it) and the node whose MODEL
#                output LoRAs attach to; both needed to offer LoRAs (optional)
#   references   { positive = "node.input", negative = "node.input", vae = node, max = n }: the
#                guider inputs that reference images (ReferenceLatent) are chained into (optional)
#   control      a ControlNet a request may guide the image with, used once its file is in
#                ComfyUI's models folder (optional):
#                kind = "controlnet" (SDXL union: positive, negative = the prompt encoder nodes)
#                or "zimage-fun" (model patch: model = the node whose MODEL it patches, vae);
#                file, types (guide image types offered), strength { default, recommended, allowed }
# A workflow whose model can edit also gets [image.workflows.<name>.edit]: the same keys for
# workflows/<name>-edit.json, plus
#   image        "node.input" of the LoadImage node that receives the input image
#   blend        node whose image output has the result's size (the scaled input), which a
#                request's `strength` blends the edit back over (optional)
# That variant runs instead when a request brings an input image.
[image.workflows.z-image-turbo]
description = """Z-Image-Turbo: fast general-purpose images, photorealistic or illustrated, and \
renders short text legibly. Prompt: a few short, concrete English sentences. The negative \
prompt only takes effect at cfg above 1 (the workflow uses 1)."""
prompt = "4.text"
negative = "5.text"
seed = "8.seed"
size = ["7"]

family = "z-image"
model = "1"
control = { kind = "zimage-fun", file = "Z-Image-Turbo-Fun-Controlnet-Union-2.1-lite-2602-8steps.safetensors", model = "6", vae = "3", types = ["canny", "hed", "depth", "pose", "mlsd"], strength = { default = 0.75, recommended = [0.6, 0.9], allowed = [0, 1.5] } }

[image.workflows.z-image-turbo.settings]
steps = { input = "8.steps", recommended = [8, 10], allowed = [4, 20] }
cfg = { input = "8.cfg", recommended = [1, 1.5], allowed = [1, 4] }
sampler = { input = "8.sampler_name", recommended = ["res_multistep", "euler"] }
scheduler = { input = "8.scheduler", recommended = ["simple", "beta"] }

[image.workflows.flux2-klein-4b]
description = """FLUX.2 klein 4B: the fastest, for quick drafts, icons and simple assets; \
details and anatomy slip more often. Prompt: a plain English description. With an input \
image it edits it: the prompt is the instruction ("make the sky red, keep the rest"), and \
the result keeps the input's aspect ratio at about 1 megapixel. A negative prompt raises cfg \
to 2: slower, a bit more contrast."""
prompt = "74.text"
seed = "73.noise_seed"
size = ["66", "62"]
negative = "77.text"
with_negative = { "63.negative" = ["77", 0], "63.cfg" = 2 }
family = "klein4b"
model = "70"
references = { positive = "63.positive", negative = "63.negative", vae = "72", max = 4 }

[image.workflows.flux2-klein-4b.settings]
steps = { input = "62.steps", recommended = [4, 6], allowed = [2, 12] }
cfg = { input = "63.cfg", recommended = [1, 2.5], allowed = [1, 5] }
sampler = { input = "61.sampler_name", recommended = ["euler"] }

[image.workflows.flux2-klein-4b.edit]
prompt = "74.text"
seed = "73.noise_seed"
image = "76.image"
blend = "80"
negative = "77.text"
with_negative = { "121.conditioning" = ["77", 0], "63.cfg" = 2 }
references = { positive = "63.positive", negative = "63.negative", vae = "72", max = 2 }

[image.workflows.klein9b-realism]
description = """FLUX.2 klein 9B realism fine-tune: fast photorealistic people and scenes. \
Prompt: detailed natural-language description; \
describe the pose precisely (hands, arms, framing). With an input image it edits it: the \
prompt is the instruction; clothing, setting and style changes work better than pose or \
expression changes. A negative prompt raises cfg to 2: slower, a bit more contrast."""
prompt = "74.text"
seed = "73.noise_seed"
size = ["66", "62"]
negative = "77.text"
with_negative = { "63.negative" = ["77", 0], "63.cfg" = 2 }
family = "klein9b"
model = "70"
references = { positive = "63.positive", negative = "63.negative", vae = "72", max = 4 }

[image.workflows.klein9b-realism.settings]
steps = { input = "62.steps", recommended = [4, 6], allowed = [2, 12] }
cfg = { input = "63.cfg", recommended = [1, 2.5], allowed = [1, 5] }
sampler = { input = "61.sampler_name", recommended = ["euler"] }

[image.workflows.klein9b-realism.edit]
prompt = "74.text"
seed = "73.noise_seed"
image = "76.image"
blend = "80"
negative = "77.text"
with_negative = { "121.conditioning" = ["77", 0], "63.cfg" = 2 }
references = { positive = "63.positive", negative = "63.negative", vae = "72", max = 2 }

[image.workflows.klein9b-anime]
description = """FLUX.2 klein 9B with the AniEdit LoRA: anime and illustration. \
Prompt: natural-language description of the scene and \
style. With an input image it edits it: turn a photo into anime, change clothes, pose, \
expression or hairstyle; the prompt is the instruction. A negative prompt raises cfg to 2: \
slower, a bit more contrast."""
