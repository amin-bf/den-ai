# Local AI toolchain configuration — edit by hand.
# Runtime switches (mode, active model, task on/off) live in state.json and are
# changed with the `den` CLI; the values here are only their defaults.

# llm | image | both | off
default_mode = "llm"

# The GPU broker (`den serve`, a user systemd service). Everything that uses the GPU
# goes through it: the CLI, Claude's MCP server and pi. Nothing else talks to Ollama.
# Changing the address needs: systemctl --user restart den
[broker]
base_url = "http://127.0.0.1:11435"
# Batching when both sides are wanted (mode both): while one side waits, the loaded side starts
# new requests only until either cap is reached, counted from when the other side started
# waiting. Running requests always finish before the swap (ADR 0002, ADR 0003).
batch_seconds = 120
batch_requests = 4

[llm]
backend = "ollama"
# Ollama itself; only the broker talks to it.
base_url = "http://127.0.0.1:11434"
# How long Ollama keeps a model in memory after the last request. The broker applies it to
# every caller (pi sends none, and Ollama's default is 5 m).
keep_alive = "30m"
# Settings for whichever model is active. The model itself is not named here: pick one of
# the models Ollama has downloaded with `den model`.
# 32k fits a ~23 GB 35B MoE split across the 12 GB GPU and RAM. Keep it equal to
# OLLAMA_CONTEXT_LENGTH in the Ollama service, so that other clients (pi, Claude Code)
# share the loaded model instead of reloading it with a different context.
num_ctx = 32768
# Thinking was ~3.5x slower, used ~6K of the context and added small errors, without better
# summaries (ADR 0001).
think = false

[image]
backend = "comfyui"
# ComfyUI itself; only the broker talks to it. It finds model files in $COMFYUI_DIR/models
# (default ~/ComfyUI/models).
base_url = "http://127.0.0.1:8188"
# The systemd user unit the broker starts on a swap to images and stops on a swap back.
service = "comfyui"
# How long ComfyUI stays up after the last image request.
keep_alive = "30m"
# Used when a request names no workflow.
default_workflow = "z-image-turbo"
# How much a request's upscale enlarges the image unless it gives a factor.
upscale_factor = 2

# Workflows: workflows/<name>.json is the ComfyUI graph in API format (web UI: Export (API)).
# A workflow can run when the model files its graph names are downloaded.
#   description  what it's good at and how to write its prompt, for whoever picks the workflow
#   note         appended to the description; put private notes in config.local.toml instead
#   prompt       "node.input" that receives the prompt
#   negative     "node.input" for the negative prompt (optional)
#   seed         "node.input", or a list when several nodes take the seed
#   size         node ids whose width and height inputs receive the size (optional)
#   with_negative  {"node.input" = value} set only when a request brings a negative prompt, e.g.
#                wiring the negative encoder into the guider and raising cfg (optional)
#   settings     optional per-request settings: steps, cfg, sampler, scheduler, each
#                { input = "node.input" or a list, recommended = …, allowed = [low, high] }.
#                Defaults come from the graph; values outside allowed are refused. Samplers and
#                schedulers may be any ComfyUI name; recommended lists the ones that suit the model.
#   family, model  the model family ([image.loras] entries name it) and the node whose MODEL
#                output LoRAs attach to; both needed to offer LoRAs (optional)
#   references   { positive = "node.input", negative = "node.input", vae = node, max = n }: the
#                guider inputs that reference images (ReferenceLatent) are chained into (optional)
#   control      a ControlNet a request may guide the image with, used once its file is in
#                ComfyUI's models folder (optional):
#                kind = "controlnet" (SDXL union: positive, negative = the prompt encoder nodes)
#                or "zimage-fun" (model patch: model = the node whose MODEL it patches, vae);
#                file, types (guide image types offered), strength { default, recommended, allowed }
# A workflow whose model can edit also gets [image.workflows.<name>.edit]: the same keys for
# workflows/<name>-edit.json, plus
#   image        "node.input" of the LoadImage node that receives the input image
# That variant runs instead when a request brings an input image.
[image.workflows.z-image-turbo]
description = """Z-Image-Turbo: fast general-purpose images, photorealistic or illustrated, and \
renders short text legibly. Prompt: a few short, concrete English sentences. The negative \
prompt only takes effect at cfg above 1 (the workflow uses 1)."""
prompt = "4.text"
negative = "5.text"
seed = "8.seed"
size = ["7"]

family = "z-image"
model = "1"
control = { kind = "zimage-fun", file = "Z-Image-Turbo-Fun-Controlnet-Union-2.1-lite-2602-8steps.safetensors", model = "6", vae = "3", types = ["canny", "hed", "depth", "pose", "mlsd"], strength = { default = 0.75, recommended = [0.6, 0.9], allowed = [0, 1.5] } }

[image.workflows.z-image-turbo.settings]
steps = { input = "8.steps", recommended = [8, 10], allowed = [4, 20] }
cfg = { input = "8.cfg", recommended = [1, 1.5], allowed = [1, 4] }
sampler = { input = "8.sampler_name", recommended = ["res_multistep", "euler"] }
scheduler = { input = "8.scheduler", recommended = ["simple", "beta"] }

[image.workflows.flux2-klein-4b]
description = """FLUX.2 klein 4B: the fastest, for quick drafts, icons and simple assets; \
details and anatomy slip more often. Prompt: a plain English description. With an input \
image it edits it: the prompt is the instruction ("make the sky red, keep the rest"), and \
the result keeps the input's aspect ratio at about 1 megapixel. A negative prompt raises cfg \
to 2: slower, a bit more contrast."""
prompt = "74.text"
seed = "73.noise_seed"
size = ["66", "62"]
negative = "77.text"
with_negative = { "63.negative" = ["77", 0], "63.cfg" = 2 }
family = "klein4b"
model = "70"
references = { positive = "63.positive", negative = "63.negative", vae = "72", max = 3 }

[image.workflows.flux2-klein-4b.settings]
steps = { input = "62.steps", recommended = [4, 6], allowed = [2, 12] }
cfg = { input = "63.cfg", recommended = [1, 2.5], allowed = [1, 5] }
sampler = { input = "61.sampler_name", recommended = ["euler"] }

[image.workflows.flux2-klein-4b.edit]
prompt = "74.text"
seed = "73.noise_seed"
image = "76.image"
negative = "77.text"
with_negative = { "121.conditioning" = ["77", 0], "63.cfg" = 2 }
references = { positive = "63.positive", negative = "63.negative", vae = "72", max = 2 }

[image.workflows.klein9b-realism]
description = """FLUX.2 klein 9B realism fine-tune: fast photorealistic people and scenes. \
Prompt: detailed natural-language description; \
describe the pose precisely (hands, arms, framing). With an input image it edits it: the \
prompt is the instruction; clothing, setting and style changes work better than pose or \
expression changes. A negative prompt raises cfg to 2: slower, a bit more contrast."""
prompt = "74.text"
seed = "73.noise_seed"
size = ["66", "62"]
negative = "77.text"
with_negative = { "63.negative" = ["77", 0], "63.cfg" = 2 }
family = "klein9b"
model = "70"
references = { positive = "63.positive", negative = "63.negative", vae = "72", max = 3 }

[image.workflows.klein9b-realism.settings]
steps = { input = "62.steps", recommended = [4, 6], allowed = [2, 12] }
cfg = { input = "63.cfg", recommended = [1, 2.5], allowed = [1, 5] }
sampler = { input = "61.sampler_name", recommended = ["euler"] }

[image.workflows.klein9b-realism.edit]
prompt = "74.text"
seed = "73.noise_seed"
image = "76.image"
negative = "77.text"
with_negative = { "121.conditioning" = ["77", 0], "63.cfg" = 2 }
references = { positive = "63.positive", negative = "63.negative", vae = "72", max = 2 }

[image.workflows.klein9b-anime]
description = """FLUX.2 klein 9B with the AniEdit LoRA: anime and illustration. \
Prompt: natural-language description of the scene and \
style. With an input image it edits it: turn a photo into anime, change clothes, pose, \
expression or hairstyle; the prompt is the instruction. A negative prompt raises cfg to 2: \
slower, a bit more contrast."""
prompt = "74.text"
seed = "73.noise_seed"
size = ["66", "62"]
negative = "77.text"
with_negative = { "63.negative" = ["77", 0], "63.cfg" = 2 }
family = "klein9b"
model = "70"
references = { positive = "63.positive", negative = "63.negative", vae = "72", max = 3 }

[image.workflows.klein9b-anime.settings]
steps = { input = "62.steps", recommended = [4, 6], allowed = [2, 12] }
cfg = { input = "63.cfg", recommended = [1, 2.5], allowed = [1, 5] }
sampler = { input = "61.sampler_name", recommended = ["euler"] }

[image.workflows.klein9b-anime.edit]
prompt = "74.text"
seed = "73.noise_seed"
image = "76.image"
negative = "77.text"
with_negative = { "121.conditioning" = ["77", 0], "63.cfg" = 2 }
references = { positive = "63.positive", negative = "63.negative", vae = "72", max = 2 }

[image.workflows.chroma1-hd]
description = """Chroma1-HD: slow, highest-quality photorealistic images, with a real negative \
prompt (cfg 6, 35 steps). Prompt: a long, detailed natural-language caption; the negative \
lists what to avoid."""
prompt = "5.text"
negative = "6.text"
seed = "9.noise_seed"
size = ["8"]
family = "chroma"
model = "1"

[image.workflows.chroma1-hd.settings]
steps = { input = "12.steps", recommended = [26, 40], allowed = [10, 60] }
cfg = { input = "10.cfg", recommended = [4, 6], allowed = [1, 10] }
sampler = { input = "11.sampler_name", recommended = ["euler", "res_multistep"] }
scheduler = { input = "12.scheduler", recommended = ["beta", "simple"] }

[image.workflows.wai-illustrious]
description = """WAI-illustrious (SDXL): anime and illustration, with a hires-fix pass that \
upscales 1.5x (default 1024x1344). Prompt: comma-separated Danbooru tags, starting with \
"masterpiece, best quality, amazing quality"; the negative is tags too. Responds to \
weights like (tag:1.2)."""
prompt = "2.text"
negative = "3.text"
seed = ["5.seed", "10.seed"]
size = ["4"]
family = "sdxl"
model = "1"
control = { kind = "controlnet", file = "controlnet-union-sdxl-promax.safetensors", positive = "2", negative = "3", types = ["canny", "lineart", "scribble", "pose", "depth", "normal", "segment", "tile"], strength = { default = 0.7, recommended = [0.5, 0.9], allowed = [0, 1.5] } }

[image.workflows.wai-illustrious.settings]
steps = { input = "5.steps", recommended = [24, 30], allowed = [10, 50] }
cfg = { input = ["5.cfg", "10.cfg"], recommended = [5, 7], allowed = [1, 12] }
sampler = { input = ["5.sampler_name", "10.sampler_name"], recommended = ["euler_ancestral", "dpmpp_2m"] }
scheduler = { input = ["5.scheduler", "10.scheduler"], recommended = ["normal", "karras"] }

[image.workflows.realvisxl]
description = """RealVisXL V5.0 (SDXL): photorealistic people, portraits and scenes, with natural \
skin. Prompt: a natural-language photo description with camera terms (lens, light); the \
negative lists what to avoid, and "(face asymmetry, eyes asymmetry, deformed eyes, open mouth)" \
suits it. Responds to weights like (word:1.2). Default 896x1152."""
prompt = "2.text"
negative = "3.text"
seed = "5.seed"
size = ["4"]
family = "sdxl"
model = "1"
control = { kind = "controlnet", file = "controlnet-union-sdxl-promax.safetensors", positive = "2", negative = "3", types = ["canny", "lineart", "scribble", "pose", "depth", "normal", "segment", "tile"], strength = { default = 0.7, recommended = [0.5, 0.9], allowed = [0, 1.5] } }

[image.workflows.realvisxl.settings]
steps = { input = "5.steps", recommended = [25, 40], allowed = [10, 60] }
cfg = { input = "5.cfg", recommended = [4, 6], allowed = [1, 12] }
sampler = { input = "5.sampler_name", recommended = ["dpmpp_2m", "dpmpp_sde", "dpmpp_2m_sde"] }
scheduler = { input = "5.scheduler", recommended = ["karras"] }

[image.workflows.juggernaut-xl]
description = """Juggernaut XI (SDXL): versatile photorealism with a cinematic look: people, \
landscapes, architecture, products. Prompt: natural language with photographic terms (shot \
type, lens, lighting, film stock); short tag lists work too. Needs little negative prompt. \
Responds to weights like (word:1.2). Default 832x1216."""
prompt = "2.text"
negative = "3.text"
seed = "5.seed"
size = ["4"]
family = "sdxl"
model = "1"
control = { kind = "controlnet", file = "controlnet-union-sdxl-promax.safetensors", positive = "2", negative = "3", types = ["canny", "lineart", "scribble", "pose", "depth", "normal", "segment", "tile"], strength = { default = 0.7, recommended = [0.5, 0.9], allowed = [0, 1.5] } }

[image.workflows.juggernaut-xl.settings]
steps = { input = "5.steps", recommended = [30, 40], allowed = [10, 60] }
cfg = { input = "5.cfg", recommended = [3, 6], allowed = [1, 12] }
sampler = { input = "5.sampler_name", recommended = ["dpmpp_2m", "dpmpp_2m_sde"] }
scheduler = { input = "5.scheduler", recommended = ["karras"] }

# Upscale models a request may run the finished image through (upscale = {name, factor}), with
# any workflow, once the file is in ComfyUI's models/upscale_models folder.
#   file         the file name in models/upscale_models
#   scale        the model's native factor; a smaller requested factor scales down after it
#   description  what it suits, for whoever picks it
[image.upscalers.ultrasharp]
file = "4x-UltraSharp.safetensors"
scale = 4
description = "4x-UltraSharp: photos and general images, crisp detail."

[image.upscalers.realesrgan]
file = "RealESRGAN_x4plus.safetensors"
scale = 4
description = "Real-ESRGAN x4plus: photos; smoother than ultrasharp, cleans up noise."

[image.upscalers.realesrgan-anime]
file = "RealESRGAN_x4plus_anime_6B.pth"
scale = 4
description = "Real-ESRGAN x4plus anime: anime and illustration, clean lines and flat colour."

# LoRAs a request may add on top of a workflow (loras = [{name, strength}]). One is offered to
# every workflow of its family whose graph doesn't already load it, once the file is in
# ComfyUI's models/loras folder.
#   file         the file name in models/loras
#   family       the workflows' family it fits
#   description  what it does, for whoever picks it
#   strength     { default = …, recommended = [low, high], allowed = [low, high] }
[image.loras.aniedit]
file = "aniedit-klein9b-v2.safetensors"
family = "klein9b"
description = "AniEdit: anime and illustration look; on the realism workflow it pulls the image toward anime."
strength = { default = 1.0, recommended = [0.5, 1.0], allowed = [0, 1.5] }

# Tasks Claude may delegate. Each becomes an allowed value of the MCP tool's `task`
# argument; disabled tasks disappear from the tool. Toggle with: den task <name> on|off
[tasks.summarize]
enabled = true
description = "Condense long text, logs or files into the key points."
system = """You summarize accurately and concisely. Keep concrete facts: names, numbers, \
error messages, file paths. Never invent details that are not in the input. If the input \
does not contain what was asked for, say so."""

[tasks.extract]
enabled = true
description = "Pull specific facts or structured data (e.g. JSON) out of text or files."
system = """You extract exactly the requested information from the input. Output only the \
result in the requested format, with no commentary. Use null or an empty list for anything \
that is not present — never guess."""

[tasks.classify]
enabled = true
description = "Label or sort items into given categories."
system = """You classify items into the categories you are given. Output only the labels \
in the requested format. If an item fits no category, label it "unknown"."""

[tasks.draft]
enabled = true
description = "First drafts of commit messages, PR descriptions, docs or notes, for Claude to review."
system = """You write clear, plain first drafts in the requested style and format. Be \
concise and specific; no filler, no marketing tone."""
